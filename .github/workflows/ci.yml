name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cleanpost
          POSTGRES_PASSWORD: cleanpost
          POSTGRES_DB: cleanpost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cleanpost"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cleanpost_web:cleanpost_web@localhost:5432/cleanpost_test
      TEST_DATABASE_ADMIN_URL: postgres://cleanpost:cleanpost@localhost:5432/cleanpost_test
      DATABASE_URL: postgres://cleanpost_web:cleanpost_web@localhost:5432/cleanpost
      DATABASE_ADMIN_URL: postgres://cleanpost:cleanpost@localhost:5432/cleanpost
      APP_URL: http://localhost:3000
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      EMAIL_FROM: Cleanpost <no-reply@cleanpost.local>
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for browser tests (axe)
        run: pnpm --filter @cleanpost/ui exec playwright install --with-deps chromium
      - name: Create database roles and test database
        run: psql -h localhost -U cleanpost -d cleanpost -f docker/postgres/init.sql
        env:
          PGPASSWORD: cleanpost
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @cleanpost/ui build-storybook --quiet
      - name: End-to-end (sign-in, two-factor, company, shell; axe in both themes)
        run: |
          export BETTER_AUTH_SECRET="$(openssl rand -base64 32)"
          # The seed encrypts tax IDs; a throwaway key for this run's synthetic data.
          export FIELD_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          pnpm db:migrate
          pnpm seed
          pnpm --filter @cleanpost/web build
          pnpm --filter @cleanpost/web test:e2e
