# Local development services. Synthetic data only.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cleanpost
      POSTGRES_PASSWORD: cleanpost
      POSTGRES_DB: cleanpost
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cleanpost']
      interval: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI
volumes:
  pgdata:
